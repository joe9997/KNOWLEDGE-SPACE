<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050b19" />
    <!--
      BUGFIX（旧版样式）：应用自己实现了深浅两套主题。
      声明 color-scheme 让浏览器（Chrome/Edge 的强制深色）不再对浅色主题做自动反色；
      darkreader-lock 让 Dark Reader 这类深色扩展跳过本页，
      否则浅色页面会被反转成“中性灰面板 + 米白文字”，看起来像旧版界面。
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050b19'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23d3e6ff'/%3E%3Cellipse cx='32' cy='32' rx='23' ry='10' fill='none' stroke='%238fc2ff' stroke-opacity='.65' transform='rotate(-28 32 32)'/%3E%3Ccircle cx='50' cy='21' r='2.2' fill='%23d3e6ff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="回源 · KNOWLEDGE SPACE — 把一段讲义变成可溯源、可自测的知识星空。"
    />
    <title>回源 · KNOWLEDGE SPACE</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('huiyuan.theme');
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
